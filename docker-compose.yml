services:
  tienda-online-app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tienda-online-app-jdk21
    restart: unless-stopped  # Reiniciar automáticamente si falla
    
    # Variables de entorno (opcional)
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - TZ=Europe/Madrid
      # Configurar URL de base de datos para usar el nombre del servicio postgres en la red Docker
      - DATASOURCE_URL=jdbc:postgresql://postgres:5432/tiendaonline
      - DATASOURCE_USERNAME=postgres
      - DATASOURCE_PASSWORD=postgres
    
    # Exponer puerto de la aplicación
    ports:
      - "8080:8080"
    
    # Volúmenes para desarrollo - monta el código fuente para cambios en caliente
    volumes:
      - ./logs:/app/logs
      - ./pom.xml:/app/pom.xml
      - ./core:/app/core
      - ./app:/app/app
      - ./domain:/app/domain
      - ./restport:/app/restport
      - ./kafkaport:/app/kafkaport
      - ./ddbbport:/app/ddbbport
      - ./kafkaprodport:/app/kafkaprodport
      - maven-cache:/root/.m2  # Cache de Maven para acelerar compilaciones
    
    # Comando para desarrollo: compila y ejecuta en cada inicio
    # Esto permite cambios en el código sin reconstruir la imagen
    command: >
      sh -c "
        echo '🔨 Compilando aplicación...' &&
        mvn clean install -DskipTests &&
        echo '▶️  Ejecutando aplicación...' &&
        cd app && mvn exec:java
      "
    
    # Dependencias: espera a que PostgreSQL esté listo y saludable
    #depends_on:
    #  postgres:
    #    condition: service_healthy
    
    # Red personalizada
    networks:
      - tienda-online-network

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tienda-online-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - tienda-online-app
    networks:
      - tienda-online-network

  postgres:
    profiles: ["infra"]
    image: postgres:15-alpine
    container_name: tienda-online-app-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tiendaonline
      - TZ=Europe/Madrid
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Montar scripts SQL de inicialización
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - tienda-online-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  kafka:
    profiles: ["infra"]
    image: apache/kafka-native
    container_name: tienda-online-kafka
    ports:
      - "9092:9092"
    environment:
      # Un solo listener de broker + el de controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9091
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

      # KRaft / controller
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9091

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - tienda-online-network

# Red personalizada
networks:
  tienda-online-network:
    driver: bridge

# Volúmenes nombrados (opcional)
volumes:
  maven-cache:
    driver: local
  postgres-data:
    driver: local
