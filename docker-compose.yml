services:
  hello-world-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hello-world-java21
    image: hello-world:latest
    restart: "no"  # No reiniciar automáticamente
    
    # Variables de entorno (opcional)
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - TZ=Europe/Madrid
    
    # Volúmenes para desarrollo (opcional)
    volumes:
      - ./logs:/app/logs
    
    # Red personalizada (opcional)
    networks:
      - hello-world-network
    
    # Comando personalizado para desarrollo
    # Descomenta la siguiente línea si quieres ejecutar en modo desarrollo
    # command: ["mvn", "exec:java", "-Dexec.mainClass=com.example.app.HelloWorldApplication"]
    
    # Healthcheck removido - no es necesario para una aplicación que se ejecuta una vez
    # Dependencias: espera a que PostgreSQL esté listo
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: hello-world-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tiendaonline
      - TZ=Europe/Madrid
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hello-world-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

# Red personalizada
networks:
  hello-world-network:
    driver: bridge

# Volúmenes nombrados (opcional)
volumes:
  maven-cache:
    driver: local
  postgres-data:
    driver: local
