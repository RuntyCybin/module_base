services:
  tienda-online-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tienda-online-app-jdk21
    restart: "no"  # No reiniciar automáticamente
    
    # Variables de entorno (opcional)
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - TZ=Europe/Madrid
      # Configurar URL de base de datos para usar host.docker.internal (accede al host donde postgres está expuesto)
      - DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/tiendaonline
    
    # Exponer puerto de la aplicación
    ports:
      - "8080:8080"
    
    # Volúmenes para desarrollo - monta el código fuente para cambios en caliente
    volumes:
      - ./logs:/app/logs
      - ./pom.xml:/app/pom.xml
      - ./core:/app/core
      - ./app:/app/app
      - ./domain:/app/domain
      - ./restport:/app/restport
      - ./ddbbport:/app/ddbbport
      - maven-cache:/root/.m2  # Cache de Maven para acelerar compilaciones
    
    # Comando para desarrollo: compila y ejecuta en cada inicio
    # Esto permite cambios en el código sin reconstruir la imagen
    command: >
      sh -c "
        echo '🔨 Compilando aplicación...' &&
        mvn clean install -DskipTests &&
        echo '▶️  Ejecutando aplicación...' &&
        cd app && mvn exec:java
      "
    
    # Healthcheck removido - no es necesario para una aplicación que se ejecuta una vez
    # Dependencias: espera a que PostgreSQL esté listo
    depends_on:
      - postgres
    
    # Red personalizada
    networks:
      - tienda-online-network

  postgres:
    image: postgres:15-alpine
    container_name: tienda-online-app-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tiendaonline
      - TZ=Europe/Madrid
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Montar scripts SQL de inicialización
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - tienda-online-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

# Red personalizada
networks:
  tienda-online-network:
    driver: bridge

# Volúmenes nombrados (opcional)
volumes:
  maven-cache:
    driver: local
  postgres-data:
    driver: local
